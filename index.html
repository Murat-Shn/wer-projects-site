<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WER Projects — Hello World</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #07111f;
        color: #f7fbff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, #163f63 0, transparent 36%),
          radial-gradient(circle at 85% 75%, #173d34 0, transparent 30%),
          #07111f;
      }

      main {
        width: min(90%, 680px);
        padding: 64px 36px;
        text-align: center;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 28px;
        background: rgb(7 17 31 / 72%);
        box-shadow: 0 32px 80px rgb(0 0 0 / 35%);
        backdrop-filter: blur(16px);
      }

      p {
        margin: 0 0 12px;
        color: #83e4c2;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 12vw, 7rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      small {
        display: block;
        margin-top: 24px;
        color: #aab9ca;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p>WER Projects</p>
      <h1>Hello<br />World.</h1>
      <small>GitHub bağlantısı çalışıyor 🎉</small>
    </main>
  </body>
</html>
